<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - LearnSpace</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="../css/forgotpasswordcss.css">

</head>


<body>


<div class="card">


<h2>

<i class="fa-solid fa-key"></i>

Forgot Password

</h2>



<form id="forgotForm">



<div class="input-box">

<label>
Account Type
</label>


<select id="accountType">

<option value="">
Select Account Type
</option>

<option value="student">
Student
</option>

<option value="admin">
Admin
</option>

</select>

</div>





<div class="input-box">

<label>
Registered ID
</label>

<input
type="text"
id="userId"
placeholder="Enter Student ID / Admin ID"
required>

</div>






<div class="input-box">

<label>
New Password
</label>


<input

type="password"

id="newPassword"

placeholder="Enter new password"

required>

</div>







<div class="input-box">

<label>
Confirm Password
</label>


<input

type="password"

id="confirmPassword"

placeholder="Confirm password"

required>

</div>






<button

type="submit"

class="btn">

Reset Password

</button>





<p class="message"></p>




</form>





<div class="login-link">

Remember your password?

<a href="login.html">
Login Here
</a>

</div>





<a href="home.html" class="back-btn">

<i class="fa-solid fa-house"></i>

Back to Home

</a>





</div>


<script type="module" src="../js/forgotpassword.js"></script>


</body>

</html>
